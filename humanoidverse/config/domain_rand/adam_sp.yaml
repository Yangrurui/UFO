# @package _global_

# Adam SP training randomization. Physics: 5 ms; policy: 20 ms.
# This file is selected with domain_rand=adam_sp in the robot profile.
domain_rand:
  # Startup: one multiplier per environment/body, shared by mass and inertia.
  randomize_link_mass: true
  link_mass_range: [0.95, 1.05]
  randomize_link_inertia_with_mass: true

  # Startup: torso center of mass, in meters along each local axis.
  randomize_base_com: true
  base_com_range:
    x: [-0.02, 0.02]
    y: [-0.02, 0.02]
    z: [-0.02, 0.02]
  randomize_base_mass: false

  # Startup: dimensionless sliding friction, shared across the robot's geoms.
  # Ground sliding friction is zero so contact uses the sampled robot value.
  randomize_friction: true
  friction_range: [0.5, 1.25]
  friction_shared_random: true
  friction_robot_controls_ground: true

  # Startup: independent multipliers of explicit XLab Kp/Kd for each joint.
  randomize_pd_gain: true
  kp_range: [0.9, 1.1]
  kd_range: [0.9, 1.1]

  # Reset: default joint target offset in radians.
  randomize_default_dof_pos: true
  default_dof_pos_noise_range: [-0.02, 0.02]

  # Actuator command delay: physics steps, 0/5/10/15/20 ms.
  # Each actuator group/environment samples separately at reset.
  randomize_ctrl_delay: true
  ctrl_delay_step_range: [0, 4]
  # Inference delay: milliseconds, sampled 10/15/20 for each new command.
  # All joints in an environment share this delay; actuator delay adds to it.
  inference_delay_range_ms: [10.0, 20.0]

  # Training reference reset only. All values are uniform half ranges.
  # Explicit evaluation target-state resets bypass these perturbations.
  randomize_reference_reset: true
  reference_reset:
    joint_position_half_range: 0.05                  # rad; clamped to hard limits
    root_position_half_range: [0.025, 0.025, 0.005]  # m, world xyz
    root_rotation_half_range: [0.05, 0.05, 0.1]     # rad, world roll/pitch/yaw
    root_linear_velocity_half_range: [0.25, 0.25, 0.1]  # m/s, world xyz
    root_angular_velocity_half_range: [0.26, 0.26, 0.39] # rad/s, world xyz

  # Periodic root velocity impulses (not forces).
  push_robots: true
  push_interval_s: [1, 3]    # seconds
  max_push_vel_xy: 0.5      # +/- m/s per horizontal axis
  max_push_ang_vel: 0.5     # +/- rad/s per axis
  push_robot_recovery_time: 2.0

  # Optional torque disturbance remains disabled.
  randomize_torque_rfi: false
  rfi_lim: 0.1
  randomize_rfi_lim: false
  rfi_lim_range: [0.5, 1.5]
